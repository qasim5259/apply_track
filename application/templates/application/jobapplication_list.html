<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ApplyTrack - My Job Applications</title>
</head>

<body>
    <h1>My Job Applications</h1>

    <ul>
        {% for job in object_list %}
        <li>
            <strong>{{ job.company }}</strong> — {{ job.job_title }}
            (Status: {{ job.status }})
            {% if job.application_date %} | Applied: {{ job.application_date|date:"M d, Y" }}{% endif %}
        </li>
        {% empty %}
        <li>No job applications tracked yet!</li>
        {% endfor %}
    </ul>
</body>

</html>
