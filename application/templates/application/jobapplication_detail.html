{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h1 class="fw-bold">{{ application.job_title }}</h1>
            <h4 class="text-muted">{{ application.company }}</h4>
            <hr>
            <p class="card-text">
                <strong>Status:</strong>
                <span class="badge 
                    {% if application.status == 'applied' %}bg-primary
                    {% elif application.status == 'interview' %}bg-warning text-dark
                    {% elif application.status == 'offer' %}bg-success
                    {% elif application.status == 'rejected' %}bg-danger
                    {% else %}bg-secondary{% endif %}">
                    {{ application.get_status_display }}
                </span>
            </p>
            <a href="{% url 'jobapplication_list' %}" class="btn btn-secondary mt-3">Back to Applications</a>
        </div>
    </div>
</div>
{% endblock content %}
