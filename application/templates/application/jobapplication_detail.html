{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h1 class="fw-bold">{{ application.job_title }}</h1>
            <h4 class="text-muted">{{ application.company }}</h4>
            <hr>
            <p><strong>Status:</strong> <span class="badge bg-info text-dark">{{ application.status }}</span></p>
            <p><strong>Applied Date:</strong> {{ application.application_date }}</p>
            <a href="{% url 'jobapplication_list' %}" class="btn btn-secondary mt-3">Back to Applications</a>
        </div>
    </div>
</div>
{% endblock content %}
