{% extends "base.html" %}

{% block title %}Delete Application - ApplyTrack{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h3 class="card-title mb-0">Confirm Deletion</h3>
                </div>
                <div class="card-body text-center">
                    <p class="fs-5 mb-4">
                        Are you sure you want to delete the application for <br>
                        <strong>{{ application.job_title }}</strong> at <strong>{{ application.company }}</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'jobapplication_list' %}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
